name: Build and Package GTA V Mod Loader

on:
  push:
    branches: [ main, master ]

jobs:
  build-mods:
    runs-on: windows-latest

    steps:
    - name: Checkout Repository
      uses: actions/checkout@v4

    - name: Configure CMake
      run: cmake -B build -S .

    - name: Build Project (Release)
      run: cmake --build build --config Release

    - name: Create Output Directory
      run: New-Item -ItemType Directory -Force -Path "bin/output"

    - name: Copy Mod Files to Main Directory
      run: |
        Copy-Item "build/Release/dinput8.dll" "bin/output/" -ErrorAction SilentlyContinue
        Copy-Item "mods/menyoo.asi" "bin/output/" -ErrorAction SilentlyContinue
        Copy-Item "mods/rifleadjuster.asi" "bin/output/" -ErrorAction SilentlyContinue
        Copy-Item "mods/rifleadjuster.ini" "bin/output/" -ErrorAction SilentlyContinue
        Copy-Item "Rloader.dll" "bin/output/" -ErrorAction SilentlyContinue

    - name: Upload Build Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: GTAV-Mod-Package
        path: bin/output/
